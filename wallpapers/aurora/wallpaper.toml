[meta]
name = "Aurora"
author = "OpenASCII"
version = "1.0.0"
description = "Aurora boreal sobre montanhas e um lago que a reflete. O rato agita as cortinas; clicar lança uma estrela cadente."
category = "Paisagens"

[render]
mode = "shader"
entry = "main.hlsl"
fps = 30
cell = 12
scale = 10
font = "Cascadia Mono"
charset = " .':;|!I"
# 0 · 1 + 2 * estrelas   3 ▓ montanha   4 ─ estrela cadente
glyphs = "·+*▓─"

[colors]
background = "#01030a"
# noite -> azul -> verde aurora -> ciano -> violeta -> rosa
palette = ["#01030a", "#071a2e", "#1fd17a", "#5ff2c9", "#8a6bff", "#ff7ad9"]

[params]
speed     = { default = 1.0, min = 0.0, max = 4.0 }
intensity = { default = 1.0, min = 0.2, max = 2.0 }
height    = { default = 0.5, min = 0.2, max = 0.9 }  # altura das cortinas (fração do ecrã)
stars     = { default = 1.0, min = 0.0, max = 2.0 }
lake      = { default = 1.0, min = 0.0, max = 1.0 }  # 0 = sem lago
