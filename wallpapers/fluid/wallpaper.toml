[meta]
name = "Fluid"
author = "OpenASCII"
version = "1.0.0"
description = "Fumo colorido num fluido que se mexe como a sério. Arrasta o rato para o empurrar; clica para uma explosão. Sem ninguém a mexer, uns jatos mantêm-no em movimento."
description_en = "Colored smoke in a fluid that moves like the real thing. Drag the mouse to push it; click for an explosion. When nobody is around, a few jets keep it moving."
category = "Simulações"

[render]
mode = "shader"
entry = "main.hlsl"
fps = 60
cell = 10
scale = 10
font = "Cascadia Mono"
charset = " .,:;=+*oO#@"
glyphs = "-/|\\"   # traços na direção do escoamento
substeps = 24       # 1 advecção + 22 iterações de pressão + 1 projeção, por frame

[colors]
background = "#030409"
palette = ["#030409", "#0b1640", "#1f4fa8", "#3fb6d9", "#a8f0e6", "#ffffff"]

[params]
jets  = { default = 1.0, min = 0.0, max = 3.0 }  # força dos jatos automáticos
swirl = { default = 1.0, min = 0.0, max = 4.0 }  # velocidade a que os jatos rodam
fade  = { default = 1.4, min = 0.1, max = 5.0 }  # quão depressa a tinta desaparece
color = { default = 1.0, min = 0.0, max = 1.0 }  # cor pela vorticidade (quente/frio)
curl  = { default = 2.5, min = 0.0, max = 4.0 }  # força dos remoinhos (confinamento de vorticidade)
