[meta]
name = "Life"
author = "OpenASCII"
version = "1.0.0"
description = "O Jogo da Vida de Conway: células que nascem e morrem, com cor pela idade e rastos. Passa o rato para desenhar vida; clica para lançar planadores."
description_en = "Conway's Game of Life: cells that are born and die, colored by age, with trails. Move the mouse to draw life; click to launch gliders."
category = "Simulações"

[render]
mode = "shader"
entry = "main.hlsl"
fps = 30
cell = 10
scale = 10
font = "Cascadia Mono"
charset = " .,:;+*oO@"

[colors]
background = "#06040a"
palette = ["#06040a", "#1c1033", "#3d1f73", "#2f7fd1", "#3fd1b8", "#c8ff8a", "#ffffff"]

[params]
rate = { default = 15.0, min = 1.0, max = 60.0 }  # gerações por segundo
