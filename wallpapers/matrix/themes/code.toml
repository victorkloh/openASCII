# A chuva de código com código verdadeiro: o dos próprios wallpapers do AsciiPaper.
# Troca o caminho por uma pasta tua (ex.: "folder:%USERPROFILE%\\source") para ver o teu.
base = "matrix"
palette = ["#000000", "#03240f", "#0a5a2a", "#1fbf5a", "#7dffb0"]

[inputs]
text = "folder:.."

[params]
code = 1.0
speed = 0.7
density = 0.85
