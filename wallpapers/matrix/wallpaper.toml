[meta]
name = "Matrix"
author = "OpenASCII"
version = "1.0.0"
description = "Chuva de caracteres; as colunas desviam-se do cursor"
description_en = "Character rain; the columns move out of the cursor's way."
category = "Retro"

[render]
mode = "shader"
entry = "main.hlsl"
fps = 30
cell = 14
font = "Cascadia Mono"
# O primeiro caractere (espaço) é o "vazio"; os restantes são sorteados.
charset = " 0123456789ABCDEFXYZ:.=*+-<>|¦$#@&%"

[colors]
background = "#010402"
palette = ["#010402", "#003b12", "#00a83a", "#3dff7a"]

[params]
speed   = { default = 1.0, min = 0.1, max = 4.0 }
density = { default = 0.7, min = 0.1, max = 1.0 } # fração das colunas com chuva
radius  = { default = 9.0, min = 0.0, max = 30.0 } # raio do desvio à volta do cursor (células)
code    = { default = 0.0, min = 0.0, max = 1.0 }  # 1 = mostrar o texto de [inputs] text (tema "code")
