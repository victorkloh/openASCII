[meta]
name = "Terrain"
author = "AsciiPaper"
version = "1.0.0"
description = "Paisagem de ruído a deslizar devagar; o rato faz parallax"
category = "Paisagens"

[render]
mode = "shader"
entry = "main.hlsl"
fps = 30
cell = 11
font = "Cascadia Mono"
charset = " .,:;~=+*#%@"

[colors]
background = "#02040a"
# água funda -> água -> areia -> erva -> rocha -> neve
palette = ["#06142e", "#12457a", "#c9b27a", "#3f7d3a", "#6b6157", "#f2f4f7"]

[params]
speed    = { default = 1.0, min = 0.0, max = 6.0 }
scale    = { default = 2.2, min = 0.5, max = 8.0 }
parallax = { default = 1.0, min = 0.0, max = 3.0 }
clouds   = { default = 0.5, min = 0.0, max = 1.0 }
